name: Release Obsidian plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Semver release tag (e.g. 1.14.0)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Determine release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Verify manifest version matches tag
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            const tag = process.env.TAG;
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag || "")) {
              throw new Error("Invalid semver tag: " + tag);
            }
            if (manifest.version !== tag) {
              throw new Error("manifest.version (" + manifest.version + ") !== tag (" + tag + ")");
            }
            if (versions[tag] !== manifest.minAppVersion) {
              throw new Error("versions.json[" + tag + "] !== manifest.minAppVersion");
            }
          '
        env:
          TAG: ${{ steps.meta.outputs.tag }}

      - name: Build & verify community compliance
        run: |
          npm run build
          npm run verify:compliance

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
            gh release edit "$TAG" --draft=false --prerelease=false
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "FlightClub Markdown $TAG (Community Plugins compliant build with artifact attestation)." \
              main.js manifest.json styles.css
          fi
